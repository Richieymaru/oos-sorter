api_version = "2026-07"

[[extensions]]
type = "web_pixel_extension"
name = "Waitlist browsing"
handle = "waitlist-browsing"
uid = "4451c41a-b40c-16e8-dcbb-6f6c8205a2ebfe964762"
# Strict sandbox: standard events, consent-gated by Shopify.
runtime_context = "strict"

  # Only run when the visitor has granted analytics consent — browsing is
  # recorded for engagement insight, never without permission.
  [extensions.customer_privacy]
  analytics = true
  marketing = false
  preferences = false
  sale_of_data = "enabled"

  # No merchant-configurable settings; the app endpoint is fixed. The settings
  # schema still needs a `fields` object (empty is fine).
  [extensions.settings]
  type = "object"

    [extensions.settings.fields]
